name: Test

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests and Generate Coverage Report
    runs-on: ubuntu-latest
    env:
      TURBO_FORCE: true
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: oven-sh/setup-bun@v2.1.2
      - run: bun ci
      - run: bun biome ci --reporter=github
      - run: bun run cov
